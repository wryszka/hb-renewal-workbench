<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HB Renewal Workbench</title>
<style>
  :root{
    --ink:#0f172a; --slate:#1e293b; --slate2:#334155; --bg:#f1f5f9; --card:#fff;
    --line:#e2e8f0; --line2:#cbd5e1; --mut:#64748b; --mut2:#94a3b8;
    --brand:#2563eb; --brand-d:#1d4ed8; --brand-soft:#eff6ff; --brand-line:#bfdbfe;
    --emerald:#059669; --emerald-bg:#d1fae5; --emerald-ink:#065f46;
    --amber:#b45309; --amber-bg:#fef3c7; --amber-ink:#92400e;
    --red:#dc2626; --red-bg:#fee2e2; --red-ink:#991b1b;
    --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.05);
    --shadow-lg:0 10px 24px -8px rgba(15,23,42,.25);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}
  /* sidebar */
  .sidebar{width:252px;background:linear-gradient(180deg,#0f172a,#172033);color:#cbd5e1;flex-shrink:0;
    display:flex;flex-direction:column;position:fixed;height:100vh;border-right:1px solid rgba(255,255,255,.06);z-index:5}
  .brand{display:flex;align-items:center;gap:11px;padding:16px}
  .brickmark{width:32px;height:32px;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2.5px;padding:4px;background:rgba(255,255,255,.08);flex-shrink:0}
  .brickmark i{background:#34d399;border-radius:2px;display:block}
  .brickmark i:nth-child(2){background:#60a5fa}.brickmark i:nth-child(3){background:#60a5fa}.brickmark i:nth-child(4){background:#34d399}
  .brand .bt{font-weight:800;color:#fff;font-size:15px;letter-spacing:-.01em} .brand .bs{font-size:11px;color:#94a3b8;margin-top:1px}
  .nav{flex:1;display:flex;flex-direction:column;padding:8px 10px;overflow:auto}
  .nav .nav-div{margin:auto 10px 4px;border-top:1px solid rgba(255,255,255,.08)}
  .nav-section{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5b6878;padding:15px 10px 5px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:#cbd5e1;
    font-size:13.5px;margin:1px 0;cursor:pointer;transition:background .12s,color .12s}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav a.active{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(37,99,235,.35)}
  .nav a .ic{width:18px;text-align:center;font-size:14px}
  .side-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7c8797}
  .side-foot .pill{display:inline-block;margin-top:7px;padding:2px 9px;border-radius:999px;background:rgba(52,211,153,.14);color:#34d399;font-weight:700;font-size:10px;letter-spacing:.05em}
  /* main */
  .main{margin-left:252px;flex:1;padding:26px 32px 60px;max-width:1200px;width:100%}
  @media(max-width:820px){.sidebar{position:static;width:100%;height:auto}.main{margin-left:0}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
  h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em;font-weight:700}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.11em;font-weight:700;color:var(--mut);margin:0 0 12px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:18px 0 8px;font-weight:700}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
  thead th{color:var(--mut);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;background:#f8fafc}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .row{cursor:pointer} tbody tr{transition:background .1s} .row:hover{background:var(--brand-soft)}
  .chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border:1px solid transparent}
  .chip.active{background:var(--emerald-bg);color:var(--emerald-ink);border-color:#a7f3d0}
  .chip.quarantined{background:var(--red-bg);color:var(--red-ink);border-color:#fecaca}
  .chip.differs{background:var(--amber-bg);color:var(--amber-ink);border-color:#fde68a}
  .chip.superseded{background:#f1f5f9;color:var(--mut);border-color:var(--line2)}
  .chip.plain{background:#f1f5f9;color:var(--mut);border-color:var(--line)}
  .flag{font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.06em;border:1px solid transparent}
  .flag.high{background:var(--red-bg);color:var(--red-ink);border-color:#fecaca}
  .flag.medium{background:var(--amber-bg);color:var(--amber-ink);border-color:#fde68a}
  .flag.low{background:#f1f5f9;color:var(--mut);border-color:var(--line2)}
  .flag.ok{background:var(--emerald-bg);color:var(--emerald-ink);border-color:#a7f3d0}
  .flag.padder{background:var(--amber-bg);color:var(--amber-ink);border-color:#fde68a}
  .flag.fair{background:var(--emerald-bg);color:var(--emerald-ink);border-color:#a7f3d0}
  button.act{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:9px 16px;cursor:pointer;font-size:13px;font-weight:600;box-shadow:var(--shadow);transition:background .15s}
  button.act:hover{background:var(--brand-d)}
  button.ghost{background:#fff;border:1px solid var(--line2);border-radius:9px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--slate2)}
  button.ghost:hover{background:#f8fafc}
  button.chipq{background:#fff;border:1px solid var(--line2);border-radius:20px;padding:7px 13px;margin:4px 5px 0 0;cursor:pointer;font-size:12.5px;color:var(--slate2)}
  button.chipq:hover{border-color:var(--brand);color:var(--brand)}
  .hero{background:linear-gradient(120deg,#0f172a,#1e293b 60%,#334155);color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow-lg)}
  .hero h2{color:#fff} .hero .meta{color:#cbd5e1;font-size:12.5px;margin-top:4px}
  .strip{display:flex;gap:34px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,#0f172a,#1e293b);color:#fff;border-radius:14px;padding:18px 22px;box-shadow:var(--shadow-lg);margin-bottom:18px}
  .strip .lbl{color:#94a3b8;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
  .strip .big{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
  .strip .big.brand{color:#7dd3fc}.strip .big.pos{color:#34d399}.strip .big.neg{color:#fca5a5}
  .stages{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
  .stage{background:#f1f5f9;border:1px solid var(--line2);border-radius:9px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--slate2)}
  .stage.end{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-d)}
  .stagesep{color:var(--mut2);font-weight:700}
  .lever{display:grid;grid-template-columns:1.2fr .7fr 1.1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .lever:last-child{border-bottom:none} .lever b{font-weight:600;font-size:13px}
  .lever input{width:104px;padding:6px 9px;border:1px solid var(--line2);border-radius:8px;font-size:13px;font-variant-numeric:tabular-nums;transition:.15s}
  .lever input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .lever .ctx{font-size:12px;color:var(--mut)}
  .mut{color:var(--mut)} .pos{color:var(--emerald);font-weight:600} .neg{color:var(--red);font-weight:600}
  .grid2{display:grid;grid-template-columns:1.05fr .95fr;gap:18px} @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .banner{background:linear-gradient(120deg,#eff6ff,#fff);border:1px solid var(--brand-line);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13px}
  .gov{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#7dd3fc;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .gov::before{content:"◆";font-size:9px}
  .find{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px} .find:last-child{border:none}
  details{margin:8px 0} summary{cursor:pointer;color:var(--brand);font-size:12px;font-weight:600}
  details .body{color:var(--mut);font-size:12.5px;margin-top:6px;max-width:74ch}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:40}
  .modal .box{background:#fff;border-radius:14px;padding:22px;width:460px;box-shadow:var(--shadow-lg)}
  .modal label{font-size:12px;font-weight:700;color:var(--slate2);display:block;margin-top:8px}
  .modal input,.modal textarea{width:100%;padding:9px;border:1px solid var(--line2);border-radius:8px;margin:5px 0;font:inherit}
  pre{background:#0f172a;color:#cbd5e1;padding:12px;border-radius:10px;overflow:auto;font-size:12px;line-height:1.5}
  .lin{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px}
  .lin .node{background:#f8fafc;border:1px solid var(--line2);border-radius:8px;padding:6px 11px;font-weight:600} .lin .arr{color:var(--mut2);font-weight:700}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(37,99,235,.25);border-top-color:#2563eb;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px} @media(max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .tile .k{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
  .tile .v{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tile .v.warn{color:var(--amber)} .tile .v.pos{color:var(--emerald)}
  iframe.embed{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff}
  .agentcard{display:flex;gap:14px;align-items:flex-start}
  .agenticon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;box-shadow:0 2px 10px rgba(37,99,235,.35)}
  .agenticon.rev{background:linear-gradient(135deg,#b45309,#f59e0b)} .agenticon.sum{background:linear-gradient(135deg,#059669,#34d399)}
  .jflow{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin-top:10px}
  .jgroup{flex:1;min-width:210px;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:#f8fafc}
  .jgroup .gl{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2);margin-bottom:8px}
  .jnodes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .jnode{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border:none;background:none;font:inherit;padding:2px}
  .jnode .num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:#fff;border:2px solid var(--line2);color:var(--slate2);transition:all .15s}
  .jnode:hover .num{border-color:var(--brand-line)}
  .jnode.active .num{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:var(--shadow)}
  .jnode .lab{font-size:10px;color:var(--mut);max-width:80px;text-align:center;line-height:1.2}
  .jsep{color:var(--mut2);font-weight:700;align-self:center}
  .llayer{margin:10px 0}
  .llayer .lk{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut2);display:block;margin-bottom:2px}
  .lschem{background:#f8fafc;border:1px solid var(--line2);border-radius:10px;padding:8px;display:inline-block}
  a.assetlink{display:inline-block;background:#fff;border:1px solid var(--line2);border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--slate2);text-decoration:none;margin:3px 4px 0 0}
  a.assetlink:hover{border-color:var(--brand-line);color:var(--brand-d)}
  .howglyph{font-size:12px;font-weight:600;color:var(--brand);cursor:pointer;text-decoration:none;margin-left:8px;white-space:nowrap}
  .mdbody{font-size:13.5px;line-height:1.55}
  .mdbody h2{font-size:18px;margin:16px 0 6px} .mdbody h3{font-size:15px;margin:15px 0 4px} .mdbody h4{font-size:13.5px;margin:11px 0 2px;color:var(--slate2)}
  .mdbody p{margin:5px 0} .mdbody li{margin:2px 0} .mdbody ul{margin:4px 0 8px 4px;padding-left:18px}
  .mdbody code{background:#f1f5f9;border-radius:4px;padding:1px 5px;font-size:12px;font-family:ui-monospace,Menlo,monospace} .mdbody a{color:var(--brand)} .mdbody hr{border:none;border-top:1px solid var(--line2);margin:12px 0}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brickmark"><i></i><i></i><i></i><i></i></span>
      <div><div class="bt">Bricksurance</div><div class="bs">H&amp;B Renewal Workbench</div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Databricks · DEV<br><span class="pill">UNITY CATALOG · SYNTHETIC</span></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="modal" id="modal"><div class="box">
  <h2>Save scenario</h2><div class="mut" style="font-size:12.5px;margin-bottom:6px">Retained as a governed decision with full audit and lineage.</div>
  <label>Scenario name</label><input id="sc_name" placeholder="e.g. Trend held to book">
  <label>Reason (required)</label><textarea id="sc_reason" rows="3" placeholder="Why this position — for the record and the audit trail"></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
    <button class="ghost" onclick="closeModal()">Cancel</button><button class="act" onclick="doSave()">Save decision</button></div>
</div></div>

<script>
const $=s=>document.querySelector(s); const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const pct=x=>x==null?"—":(x*100).toFixed(1)+"%"; const usd=x=>x==null?"—":"$"+Math.round(x).toLocaleString();
const api=(u,o)=>fetch(u,o).then(r=>r.json());
let STATE={view:"home",doc:null,inputs:null,overrides:{}};
const NAV=[
  ["Overview",[["home","Daily view","🏠"],["dashboard","Dashboard","📈"]]],
  ["Pipeline",[["ingestion","Ingestion","📥"],["book","Book","📖"]]],
  ["Renewal",[["workspace","Renewal Workspace","🧮"],["benchmarks","Benchmarks","📊"]]],
  ["Intelligence",[["agents","Agents","🤖"],["ask","Ask the Book","💬"],["audit","Audit","🛡️"]]],
];
const RENDER={home:renderHome,dashboard:renderDashboard,ingestion:renderIngestion,book:renderBook,workspace:renderWorkspace,benchmarks:renderBench,learn:renderLearn,agents:renderAgents,ask:renderAsk,audit:renderAudit,roadmap:renderRoadmap};
let LEARN_ANCHOR=null;  // node # to pre-expand when Learn is opened from another panel

function computeBuildup(inp, ov){
  const i=Object.assign({},inp,ov||{});
  if(ov&&ov.credibility_experience_weight!=null&&(ov.credibility_manual_weight==null))
    i.credibility_manual_weight=1-ov.credibility_experience_weight;
  const incurred=i.total_incurred_claims/i.member_months;
  const adjusted=incurred*i.demographic_adjustment;
  const ecc=adjusted-i.less_pooled_claims_pmpm;
  const eff=Math.pow(1+i.annual_trend,i.months_of_trend/12)-1;
  const projm=ecc*i.benefit_change*(1+eff)+i.projected_excess_claims_pmpm+i.large_claim_add_back_pmpm;
  const expprem=projm/i.target_loss_ratio*(1+i.benefit_advisor_fee);
  const curpmpm=i.current_total_premium_monthly/i.current_members;
  const expinc=expprem/curpmpm-1;
  const blended=i.credibility_experience_weight*expinc+i.credibility_manual_weight*i.manual_rating_pool_increase;
  const quoted=blended+i.adjustment;
  return {member_months:i.member_months,incurred_pmpm:incurred,demographic_adjustment:i.demographic_adjustment,
    adjusted_incurred_pmpm:adjusted,less_pooled_claims_pmpm:i.less_pooled_claims_pmpm,experience_claim_cost_pmpm:ecc,
    benefit_change:i.benefit_change,annual_trend:i.annual_trend,months_of_trend:i.months_of_trend,effective_trend:eff,
    projected_excess_claims_pmpm:i.projected_excess_claims_pmpm,large_claim_add_back_pmpm:i.large_claim_add_back_pmpm,
    projected_medical_pmpm:projm,target_loss_ratio:i.target_loss_ratio,benefit_advisor_fee:i.benefit_advisor_fee,
    experience_based_premium_pmpm:expprem,current_premium_pmpm:curpmpm,experience_based_increase:expinc,
    manual_rating_pool_increase:i.manual_rating_pool_increase,credibility_experience_weight:i.credibility_experience_weight,
    credibility_manual_weight:i.credibility_manual_weight,blended_rate_action:blended,adjustment:i.adjustment,quoted_change:quoted,
    current_members:i.current_members,projected_billed_premium_annual:curpmpm*(1+quoted)*i.current_members*12,
    current_billed_premium_annual:curpmpm*i.current_members*12};
}

function renderNav(){const n=$("#nav");n.innerHTML="";NAV.forEach(([sec,items])=>{
  n.appendChild(el("div","nav-section",sec));
  items.forEach(([k,label,ic])=>{const a=el("a",STATE.view===k?"active":"",`<span class="ic">${ic}</span><span>${label}</span>`);a.onclick=()=>go(k);n.appendChild(a);});});
  // Learn pinned to the bottom of the sidebar
  n.appendChild(el("div","nav-div"));
  const la=el("a",STATE.view==="learn"?"active":"",`<span class="ic">🧭</span><span>Learn</span>`);la.onclick=()=>go("learn");n.appendChild(la);
  const ra=el("a",STATE.view==="roadmap"?"active":"",`<span class="ic">🗺️</span><span>Roadmap</span>`);ra.onclick=()=>go("roadmap");n.appendChild(ra);}
function go(v){STATE.view=v;renderNav();RENDER[v]();}
function explainer(txt){const d=el("details");d.appendChild(el("summary",null,"What am I seeing?"));d.appendChild(el("div","body",txt));return d;}
function dlOriginal(doc){const wrap=el("div");wrap.style.marginTop="12px";
  if(doc&&doc.stored_path){const b=el("button","act","⬇ Download original submission");
    b.onclick=()=>{const a=document.createElement("a");a.href="/api/document/"+doc.doc_id+"/file";a.download=doc.file_name||"submission.xlsx";document.body.appendChild(a);a.click();a.remove();};
    wrap.appendChild(b);
    const p=el("div","mut","📁 Stored in governed UC Volume: "+doc.stored_path);p.style.cssText="margin-top:6px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all";wrap.appendChild(p);}
  else{wrap.appendChild(el("div","mut","Original not archived (historical import). Files ingested through the pipeline are stored in the governed Volume and pulled straight from here."));}
  return wrap;}

// ---------------- HOME / DAILY VIEW ----------------
async function renderHome(){const m=$("#main");m.innerHTML="";const d=await api("/api/overview");
  const head=el("div","hero");
  const attn=(d.counts.quarantined||0)+(d.counts.differs||0);
  head.innerHTML=`<div class="eyebrow" style="color:#7dd3fc">Daily view</div>
    <h2>Renewal desk — today</h2>
    <div class="meta">${d.book_total} renewals in the book · ${d.counts.active||0} active · ${attn} awaiting a human · governed on Unity Catalog</div>`;
  m.appendChild(head);
  const tools=el("div");tools.style.cssText="display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:-6px 0 10px";
  const rbtn=el("button","ghost","↺ Reset demo");rbtn.title="Reseed to the pristine demo state (~1–2 min)";rbtn.onclick=()=>resetDemo(rbtn);
  const rstat=el("span","mut");rstat.id="resetstatus";rstat.style.fontSize="12.5px";
  tools.append(rstat,rbtn);m.appendChild(tools);
  const k=d.kpi||{};
  const tiles=el("div","tiles");
  tiles.innerHTML=`
    <div class="tile"><div class="k">In the book</div><div class="v">${d.book_total}</div></div>
    <div class="tile"><div class="k">Active</div><div class="v">${d.counts.active||0}</div></div>
    <div class="tile"><div class="k">Needs attention</div><div class="v ${attn?'warn':''}">${attn}</div></div>
    <div class="tile"><div class="k">Avg carrier action</div><div class="v">${pct(k.avg_carrier)}</div></div>
    <div class="tile"><div class="k">Value negotiated</div><div class="v pos">${usd(k.value_negotiated)}</div></div>`;
  m.appendChild(tiles);

  if(d.hero){const c=el("div","card");c.appendChild(el("div","eyebrow","Open renewal"));

async function resetDemo(btn){
  if(!confirm("Reset the demo to the pristine seeded state?\nThis reseeds the schema on a serverless Job (~1–2 min).")) return;
  const s=$("#resetstatus");btn.disabled=true;s.innerHTML='<span class="spin"></span> starting…';
  let r;try{r=await api("/api/reset",{method:"POST"});}catch(e){r={error:String(e)};}
  if(!r||!r.run_id){s.textContent="Reset failed: "+((r&&(r.detail||r.error))||"no run id");btn.disabled=false;return;}
  const t0=Date.now();
  const poll=async()=>{
    let st;try{st=await api("/api/reset/status?run_id="+r.run_id);}catch(e){st={};}
    const secs=Math.round((Date.now()-t0)/1000);
    if(st.done){
      if(st.success){s.innerHTML="✓ reset in "+secs+"s — refreshing…";setTimeout(()=>go("home"),1200);}
      else{s.textContent="reset "+(st.result_state||"failed")+" ("+secs+"s)";btn.disabled=false;}
      return;
    }
    s.innerHTML='<span class="spin"></span> reseeding… '+secs+'s';
    setTimeout(poll,5000);
  };
  setTimeout(poll,5000);
}

  const w=$("#lcardwrap");w.innerHTML="";
  const cc=el("div","card");cc.style.cssText="margin-top:14px;border-color:var(--brand-line)";
  cc.appendChild(el("div","eyebrow","Step "+card.n+" · "+card.group));
  const grid=el("div","grid2");
  const left=el("div");
  const l1=el("div","llayer");l1.innerHTML='<span class="lk">The activity</span>';const a1=el("div",null,card.activity);a1.style.cssText="font-weight:600;font-size:14.5px";l1.appendChild(a1);left.appendChild(l1);
  const l2=el("div","llayer");l2.innerHTML='<span class="lk">How it\'s done here</span>';l2.appendChild(el("div",null,card.how));left.appendChild(l2);
  const l3=el("div","llayer");l3.innerHTML='<span class="lk">See it live</span>';
  (card.links||[]).forEach(lk=>{const a=el("a","assetlink",lk.label+(lk.external?" ↗":" →"));
    if(lk.external){a.href=lk.url;a.target="_blank";a.rel="noopener";}
    else{a.href="javascript:void 0";a.onclick=e=>{e.preventDefault();go(lk.view);};}
    l3.appendChild(a);});
  left.appendChild(l3);grid.appendChild(left);
  const right=el("div");right.style.cssText="display:flex;align-items:center;justify-content:center";
  const sc=el("div","lschem");sc.innerHTML=learnSchematic(n);right.appendChild(sc);grid.appendChild(right);

}

let GENIE={conv:null,mode:"panel"};
let GENIE_PENDING=null;
async function renderAsk(){const m=$("#main");m.innerHTML="";const c=el("div","card");
  c.appendChild(el("div","eyebrow","Genie"));c.appendChild(el("h2",null,"Ask the book"));
  c.appendChild(explainer("Natural-language questions answered by a Databricks Genie agent over the governed views and metric views. The generated SQL is shown so the governance-minded can verify it. Two surfaces over the same agent: the workbench panel (in-app, via the Conversation API) or the native Genie experience embedded."));c.appendChild(howGlyph(9));
  const tog=el("div");tog.style.cssText="display:flex;gap:6px;margin:8px 0 4px";
  const bP=el("button",GENIE.mode==="panel"?"act":"ghost","Workbench panel");
  const bN=el("button",GENIE.mode==="native"?"act":"ghost","Native Genie");
  bP.onclick=()=>{GENIE.mode="panel";renderAsk();};bN.onclick=()=>{GENIE.mode="native";renderAsk();};
  tog.append(bP,bN);c.appendChild(tog);
  if(GENIE.mode==="native"){const cfg=await api("/api/config").catch(()=>({}));
    if(cfg.genie_url){const f=el("iframe","embed");f.src=cfg.genie_url;f.style.height="720px";f.setAttribute("frameborder","0");f.style.marginTop="10px";c.appendChild(f);}
    else c.appendChild(el("div","banner","Genie space not configured — set HB_GENIE_SPACE_ID."));
    m.appendChild(c);return;}
  const ex=el("div");ex.style.marginTop="10px";["What's the average carrier-proposed action for groups over 500 lives?","Which carrier runs richest versus our book trend?","Which months drove claims for Harborview Logistics?","Where is the biggest gap between the carrier ask and our negotiated position?"].forEach(q=>{const b=el("button","chipq",q);b.onclick=()=>{$("#gq").value=q;askGenie();};ex.appendChild(b);});
  c.appendChild(ex);
  const box=el("div");box.style.cssText="margin-top:14px;display:flex;gap:8px";const inp=el("input");inp.id="gq";inp.placeholder="Ask a question about the book…";inp.style.cssText="flex:1;padding:10px 12px;border:1px solid var(--line2);border-radius:9px;font:inherit";
  inp.onkeydown=e=>{if(e.key==="Enter")askGenie();};
  const b=el("button","act","Ask");b.onclick=askGenie;box.append(inp,b);c.appendChild(box);
  const out=el("div");out.id="gout";out.style.marginTop="14px";c.appendChild(out);m.appendChild(c);
  if(GENIE_PENDING){$("#gq").value=GENIE_PENDING;GENIE_PENDING=null;askGenie();}}
function askFromDashboard(q){GENIE.mode="panel";GENIE_PENDING=q;go("ask");}
async function genieQuery(q,out){if(!q)return;out.innerHTML='<div class="mut"><span class="spin"></span> Asking Genie…</div>';
  const r=await api("/api/genie/ask",{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,conversation_id:GENIE.conv})}).catch(e=>({error:String(e)}));
  if(r.conversation_id)GENIE.conv=r.conversation_id;
  if(r.error){out.innerHTML=`<div class="banner">Genie not available: ${r.error}</div>`;return;}
  out.innerHTML="";if(r.text)out.appendChild(el("div",null,r.text.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")));
  if(r.sql){const dt=el("details");dt.appendChild(el("summary",null,"Show generated SQL"));dt.appendChild(el("pre",null,r.sql));out.appendChild(dt);}
  if(r.rows&&r.rows.length){const t=el("table");t.style.marginTop="10px";t.innerHTML="<thead><tr>"+Object.keys(r.rows[0]).map(k=>`<th>${k}</th>`).join("")+"</tr></thead>";
    const tb=el("tbody");r.rows.forEach(row=>tb.appendChild(el("tr",null,Object.values(row).map(v=>`<td>${v}</td>`).join(""))));t.appendChild(tb);out.appendChild(t);}
  if(!r.text&&!r.sql&&!(r.rows&&r.rows.length))out.innerHTML='<div class="mut">No answer returned — try rephrasing.</div>';}
async function askGenie(){genieQuery($("#gq").value.trim(), $("#gout"));}

async function renderAudit(){const m=$("#main");m.innerHTML="";const c=el("div","card");c.appendChild(el("div","eyebrow","Governance"));c.appendChild(el("h2",null,"Audit trail"));
  c.appendChild(explainer("Every ingestion, quarantine, sign-off, scenario save and approval is an append-only governed event. Click any deal or document to trace it back to the exact carrier spreadsheet it was built on — and pull that original file straight from the governed Volume."));
  const rows=await api("/api/audit");const t=el("table");t.innerHTML="<thead><tr><th>When</th><th>Event</th><th>Entity</th><th>Detail</th><th>Actor</th></tr></thead>";
  const tb=el("tbody");rows.forEach(r=>{const tr=el("tr");
    tr.appendChild(el("td","mut",r.created_at));
    tr.appendChild(el("td",null,`<span class="chip plain">${r.event_type}</span>`));
    const ec=el("td");const eid=r.entity_id||"";
    if(/^(SCN|DOC)/.test(eid)){const lk=el("a",null,eid);lk.style.cssText="color:var(--brand);cursor:pointer;font-weight:600;text-decoration:underline";lk.title="Trace to original file";lk.onclick=()=>openProvenance(eid);ec.appendChild(lk);}
    else ec.textContent=eid;
    tr.appendChild(ec);
    tr.appendChild(el("td",null,r.detail||''));
    tr.appendChild(el("td","mut",(r.actor||'').split('@')[0]));
    tb.appendChild(tr);});
  t.appendChild(tb);c.appendChild(t);
  const det=el("div");det.id="auditdetail";det.style.cssText="display:none;margin-top:16px";c.appendChild(det);
  m.appendChild(c);
  const foot=el("div","card mut");foot.style.fontSize="12.5px";
  foot.innerHTML="<b>About this demo.</b> Bricksurance is a fictional carrier group and all carriers, employers and figures here are synthetic. The renewal method is illustrative — the intent is to show the shape of a governed workflow, not to propose a rate. Every screen reads a real governed Unity Catalog table, view or function.";
  m.appendChild(foot);}
async function openProvenance(eid){const w=$("#auditdetail");w.style.display="block";w.innerHTML='<div class="mut"><span class="spin"></span> Resolving provenance…</div>';
  let scn=null,doc=null;
  if(eid.indexOf("SCN")===0){const r=await api("/api/deal/"+eid).catch(()=>null);if(r&&!r.error){scn=r.scenario;doc=r.document;}}
  if(!doc&&eid.indexOf("DOC")===0){const r=await api("/api/document/"+eid).catch(()=>null);if(r&&r.document)doc=r.document;}
  w.innerHTML="";const card=el("div","card");card.appendChild(el("div","eyebrow","Provenance · deal → document → original file"));
  if(scn){card.appendChild(el("h3",null,(scn.scenario_name||"Decision")+" — "+scn.employer_group));
    card.appendChild(el("div","mut",scn.carrier+" · "+scn.scenario_id+" · <span class=\"chip plain\">"+scn.status+"</span> · saved "+(scn.created_at||'').slice(0,16)+" · "+usd(scn.value_at_stake_annual)+"/yr at stake"));}
  else if(doc){card.appendChild(el("h3",null,doc.file_name||eid));
    card.appendChild(el("div","mut",(doc.carrier||'')+" · "+(doc.employer_group||'')+" · <span class=\"chip plain\">"+(doc.status||'')+"</span>"));}
  if(!doc){card.appendChild(el("div","banner","No linked source document for this event."));w.appendChild(card);return;}
  const chain=el("div","lin");chain.style.marginTop="10px";const nodes=[];if(scn)nodes.push("deal "+scn.scenario_id);nodes.push("1_source_document "+doc.doc_id);nodes.push("file: "+(doc.file_name||"—"));
  nodes.forEach((n,i)=>{chain.appendChild(el("span","node",n));if(i<nodes.length-1)chain.appendChild(el("span","arr","←"));});
  card.appendChild(chain);card.appendChild(dlOriginal(doc));w.appendChild(card);}
